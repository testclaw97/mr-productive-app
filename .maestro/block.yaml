# Human-like flow: block Chrome, start the service, open Chrome, prove the overlay.
# Permissions (usage-access + overlay) are granted via adb before this runs.
# Resilient timing: tapOn auto-waits for each element, so we avoid brittle hard
# assertions that fail the whole flow on a slow emulator cold-start.
appId: agency.lumieremedia.mrproductive
---
- launchApp
# v0.2.0 opens on the ONBOARDING flow first. Capture it, then Skip into the app.
- extendedWaitUntil:
    visible: "Take your time back.*"
    timeout: 60000
    optional: true
- takeScreenshot: 00-onboarding-welcome
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
# now in the app — wait for the tab bar
- extendedWaitUntil:
    visible: "Coach"
    timeout: 30000
    optional: true
- takeScreenshot: 01-home

# Accept the AI-consent gate if it's up.
- runFlow:
    when:
      visible: "I understand.*"
    commands:
      - tapOn: "I understand.*"

# --- Block Chrome (tapOn auto-waits for each element) -----------------------
- tapOn: "Blocklist"
- tapOn: "Search your apps.*"
- inputText: "Chrome"
- hideKeyboard
- tapOn: "com.android.chrome"
- takeScreenshot: 11-after-toggle

# --- Start the on-device blocker: tap the BUTTON (index 1), not the heading --
- tapOn: "Protect"
- takeScreenshot: 20-protect
- tapOn:
    text: "Start protecting"
    index: 1
- takeScreenshot: 21-protecting
- extendedWaitUntil:
    visible: "Stop protecting.*"
    timeout: 8000
    optional: true
- takeScreenshot: 22-after-start

# --- Open the blocked app → the overlay should slam up ----------------------
- launchApp:
    appId: "com.android.chrome"
- extendedWaitUntil:
    visible: ".*([Bb]locked|coach|Productive).*"
    timeout: 10000
    optional: true
- takeScreenshot: 30-opened-blocked-app
- takeScreenshot: 31-overlay-check
