# Human-like flow: block Chrome, start protecting, open Chrome, prove the overlay fires.
# Permissions (usage-access + overlay) are granted via adb before this runs.
appId: agency.lumieremedia.mrproductive
---
# NOTE: no clearState — pm clear wipes the adb-granted appops (usage access), which
# leaves "Start protecting" disabled. The APK was freshly installed, so state is clean.
- launchApp

# First launch: accept the AI-consent gate if shown.
- runFlow:
    when:
      visible: "I understand.*"
    commands:
      - tapOn: "I understand.*"

# --- Block Chrome -----------------------------------------------------------
- tapOn: "Blocklist"
- tapOn: "Search your apps.*"
- inputText: "Chrome"
- hideKeyboard            # the keyboard was covering the tab bar + toggle
- takeScreenshot: 10-search-chrome
# Tap the ROW by its unique package subtitle (not the search field's "Chrome").
- tapOn: "com.android.chrome"
- takeScreenshot: 11-after-toggle
# Confirm the toggle actually registered (guards the rest of the test).
- assertVisible:
    text: "BLOCKED \\(1\\)"
    optional: true

# --- Start the on-device blocker -------------------------------------------
- tapOn: "Protect"
- takeScreenshot: 20-protect
- tapOn:
    text: "Start protecting.*"
    optional: true
- takeScreenshot: 21-protecting

# --- Open the blocked app → the overlay should slam up ----------------------
- launchApp:
    appId: "com.android.chrome"
- extendedWaitUntil:      # give the 1s foreground poller time to react
    visible:
      text: ".*([Bb]locked|coach|Productive).*"
    timeout: 8000
    optional: true
- takeScreenshot: 30-opened-blocked-app
- assertVisible:
    text: ".*([Bb]locked|coach).*"
    optional: true
- takeScreenshot: 31-overlay-check
