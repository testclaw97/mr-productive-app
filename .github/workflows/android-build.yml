name: Android APK (release)

# Build a STANDALONE installable release APK on a free GitHub runner. Release (not
# debug) embeds the Hermes JS bundle inside the APK, so it runs without a Metro dev
# server (a debug APK hangs on the splash on a real phone). Expo's release
# signingConfig defaults to the debug keystore, so the APK stays sideloadable.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS deps
        run: npm ci
      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --no-install
      - name: Gradle assembleRelease
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-productive-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
