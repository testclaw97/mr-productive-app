name: Android APK (debug)

# Compile the app + the native mp-blocker Kotlin into an installable debug APK on a
# FREE GitHub runner (Android SDK preinstalled). No Expo account, no local Android
# toolchain — plain `expo prebuild` + `gradlew assembleDebug`. app-debug.apk is
# debug-signed and sideloadable. Repo root IS the app (app-only push).

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS deps
        run: npm ci
      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --no-install
      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-productive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
